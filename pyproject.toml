[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perp-funding-fee-farmer"
version = "0.1.0"
description = "Delta-neutral funding-rate and volume farmer between Arcus and Lighter perp DEXes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lighter-sdk==1.1.7",
    "aiohttp>=3.9",
    "websockets>=12",
    "pydantic>=2.5",
    "cryptography>=42",
    "eth-account>=0.13.4",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
farmer = "farmer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"farmer.dashboard" = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# real defects (pyflakes, bugbear), import order and py3.11 idioms; style-only families stay off
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = ["UP042"]  # (str, Enum) -> StrEnum changes str()/format() output of Side / OrderStatus / Phase

[tool.ruff.lint.isort]
known-first-party = ["farmer", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: read-only tests against the public mainnet APIs (run with FARMER_LIVE_TESTS=1)",
]
