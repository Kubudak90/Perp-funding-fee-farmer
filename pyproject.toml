[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perp-funding-fee-farmer"
version = "0.1.0"
description = "Delta-neutral funding-rate and volume farmer between Arcus and Lighter perp DEXes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lighter-sdk==1.1.7",
    "aiohttp>=3.9",
    "websockets>=12",
    "pydantic>=2.5",
    "cryptography>=42",
    "eth-account>=0.13.4",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aioresponses>=0.7.6"]

[project.scripts]
farmer = "farmer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
